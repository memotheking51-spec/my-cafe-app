<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة النادل - الطلبات الواردة</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background: #222; color: white; }
        h2 { text-align: center; }
        .alert-box { background: #333; border-right: 6px solid #ffc107; padding: 15px; margin: 15px auto; max-width: 500px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .alert-box.bill { border-right-color: #17a2b8; }
        button { background: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        #conn-status { text-align: center; color: #ffc107; margin-bottom: 20px; }
    </style>
</head>
<body>

<h2>📋 طلبات الطاولات المباشرة</h2>
<div id="conn-status">جاري الاتصال...</div>
<div id="calls-container"></div>

<script>
    const client = mqtt.connect('wss://://hivemq.com');
    const topic = 'restaurant/tables/calls';

    client.on('connect', () => {
        document.getElementById('conn-status').innerText = '🟢 متصل ومستعد لاستقبال الطلبات';
        document.getElementById('conn-status').style.color = '#28a745';
        client.subscribe(topic);
    });

    client.on('message', (topic, message) => {
        const data = JSON.parse(message.toString());
        addCallToScreen(data);
        playNotificationSound();
    });

    function addCallToScreen(data) {
        const container = document.getElementById('calls-container');
        const div = document.createElement('div');
        div.className = data.action === 'طلب الحساب' ? 'alert-box bill' : 'alert-box';
        
        div.innerHTML = `
            <div>
                <strong style="font-size: 20px;">${data.table}</strong><br>
                <span>الطلب: ${data.action}</span><br>
                <small style="color: #aaa;">الوقت: ${data.time}</small>
            </div>
            <button onclick="this.parentElement.remove()">تم التنفيذ ✔️</button>
        `;
        container.prepend(div);
    }

    function playNotificationSound() {
        // صوت تنبيه بسيط باستخدام Web Audio API
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    }
</script>

</body>
</html>
